# Render Blueprint for the API (Render dashboard > New > Blueprint, pick this repo).
# Secrets marked sync: false are asked for when the Blueprint is created.
services:
  - type: web
    name: ipolens-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter "@ipolens/api..." && pnpm --filter @ipolens/api build
    startCommand: pnpm --filter @ipolens/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true
